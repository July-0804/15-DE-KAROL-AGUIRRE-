<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis XV Años - Karol Lizeth</title>

<style>
body{
  margin:0;
  font-family:'Georgia',serif;
  background:linear-gradient(180deg,#5a0000,#c9a227);
  color:white;
  text-align:center;
}

.cover{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  animation:fadeIn 2s;
}

.cover h1{
  color:gold;
  font-size:48px;
}

.cover button{
  margin-top:20px;
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:gold;
  color:#5a0000;
  cursor:pointer;
  font-weight:bold;
}

.invitation{
  display:none;
  padding:30px;
}

.container{
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:25px;
  box-shadow:0 0 25px gold;
  animation:fadeIn 2s;
}

h2{font-size:28px;}
.gold{color:gold;font-weight:bold;}
.section{margin:35px 0;}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<!-- 🎵 Música -->
<audio autoplay loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- PORTADA -->
<div class="cover" id="cover">
  <h1>Mis XV Años</h1>
  <h2>Karol Lizeth</h2>
  <button onclick="openInvite()">Abrir invitación</button>
</div>

<!-- INVITACIÓN -->
<div class="invitation" id="invite">
  <div class="container">

    <h1 class="gold">Mis XV Años</h1>
    <h2>Karol Lizeth Aguirre Roa</h2>

    <div class="section">
      <p>Con la bendición de Dios y el amor de mi familia</p>
      <p>te invito a celebrar este día tan especial.</p>
    </div>

    <div class="section">
      <p class="gold">📅 Fecha</p>
      <p>20 de Marzo del 2026</p>

      <p class="gold">⏰ Hora</p>
      <p>8:00 p.m.</p>
    </div>

    <div class="section">
      <p class="gold">⏳ Cuenta regresiva</p>
      <div id="countdown"></div>
    </div>

    <div class="section">
      <p class="gold">📸 Galería</p>
      <img src="foto1.jpg" width="90%" style="border-radius:15px;margin:10px;">
    </div>

    <div class="section">
      <p class="gold">💌 Confirmar asistencia</p>
      <a href="https://wa.me/57TU_NUMERO?text=Confirmo%20mi%20asistencia%20a%20los%20XV%20de%20Karol%20Lizeth"
         style="background:gold;color:#5a0000;padding:15px 25px;
         border-radius:30px;text-decoration:none;font-weight:bold;">
         Confirmar por WhatsApp
      </a>
    </div>

  </div>
</div>

<script>
function openInvite(){
  document.getElementById("cover").style.display="none";
  document.getElementById("invite").style.display="block";
}

const eventDate = new Date("March 20, 2026 20:00:00").getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const d=eventDate-now;
  if(d<0){
    document.getElementById("countdown").innerHTML="¡Hoy es el gran día!";
    return;
  }
  const days=Math.floor(d/(1000*60*60*24));
  const h=Math.floor((d/(1000*60*60))%24);
  const m=Math.floor((d/(1000*60))%60);
  const s=Math.floor((d/1000)%60);
  document.getElementById("countdown").innerHTML=
    days+" días "+h+" h "+m+" m "+s+" s";
},1000);
</script>

</body>
</html>
