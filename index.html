<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis XV Años - Karol Lizeth</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: linear-gradient(180deg, #7a0000, #c9a227);
  color: white;
  text-align: center;
}

.container {
  background: rgba(0,0,0,0.6);
  margin: 20px;
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 0 20px gold;
}

h1 { color: gold; font-size: 40px; }
h2 { font-size: 26px; }

.section { margin: 30px 0; }
.gold { color: gold; font-weight: bold; }
</style>
</head>

<body>

<div class="container">
  <h1>Mis XV Años</h1>
  <h2>Karol Lizeth Aguirre Roa</h2>

  <div class="section">
    <p>Con la bendición de Dios y el amor de mi familia</p>
    <p>te invito a celebrar este día tan especial.</p>
  </div>

  <div class="section">
    <p class="gold">📅 Fecha</p>
    <p>20 de Marzo del 2026</p>

    <p class="gold">⏰ Hora</p>
    <p>8:00 p.m.</p>
  </div>

  <div class="section">
    <p class="gold">🎉 ¡Te esperamos!</p>
  </div>
</div>
<div class="section">
  <p class="gold">⏳ Cuenta Regresiva</p>
  <div id="countdown" style="font-size:22px;color:gold;"></div>
</div>

<script>
const eventDate = new Date("March 20, 2026 17:30:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const diff = eventDate - now;

  if (diff < 0) {
    document.getElementById("countdown").innerHTML = "¡Hoy es el gran día!";
    return;
  }

  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff / (1000*60*60)) % 24);
  const m = Math.floor((diff / (1000*60)) % 60);
  const s = Math.floor((diff / 1000) % 60);

  document.getElementById("countdown").innerHTML =
    d + " días " + h + " h " + m + " m " + s + " s";
}, 1000);
</script>
<div class="section">
  <p class="gold">📸 Galería</p>
  <img src="foto1.jpg" width="90%" style="border-radius:15px;margin:10px;">
</div>
</body>
</html>
